name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: 0.21.14

jobs:
  web:
    name: Build web app
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Check tag matches kaizen version
      run: |
        version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kaizen") | .version')
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match kaizen version $version"
          exit 1
        fi

    - uses: Swatinem/rust-cache@v2

    - name: Install Trunk
      run: |
        mkdir -p "$HOME/.trunk"
        curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz -C "$HOME/.trunk"
        echo "$HOME/.trunk" >> "$GITHUB_PATH"

    - name: Build web app
      working-directory: crates/kaizen-web
      run: trunk build --release

    - uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: crates/kaizen-web/dist
        if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: web
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          target: x86_64-pc-windows-msvc
        - os: ubuntu-latest
          target: x86_64-unknown-linux-musl

    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Install musl tools
      if: contains(matrix.target, 'musl')
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - uses: actions/download-artifact@v4
      with:
        name: web-dist
        path: crates/kaizen-web/dist

    # rust-embed allows a missing folder, so make sure the web app is really there
    - name: Check web app is present
      shell: bash
      run: test -f crates/kaizen-web/dist/index.html

    - name: Build kaizen
      run: cargo build --release --locked -p kaizen --target ${{ matrix.target }}

    - name: Package
      shell: bash
      run: |
        name="kaizen-${GITHUB_REF_NAME}-${{ matrix.target }}"
        release_dir="target/${{ matrix.target }}/release"

        if [ "${{ runner.os }}" = "Windows" ]; then
          7z a "$name.zip" "./$release_dir/kaizen.exe"
        else
          tar -czf "$name.tar.gz" -C "$release_dir" kaizen
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: archive-${{ matrix.target }}
        path: kaizen-*
        if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: archive-*
        path: archives
        merge-multiple: true

    - name: Generate checksums
      working-directory: archives
      run: sha256sum kaizen-* > SHA256SUMS.txt

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        prerelease=""
        if [[ "$GITHUB_REF_NAME" == *-* ]]; then
          prerelease="--prerelease"
        fi

        gh release create "$GITHUB_REF_NAME" archives/* \
          --repo "$GITHUB_REPOSITORY" \
          --title "Kaizen $GITHUB_REF_NAME" \
          --generate-notes \
          --verify-tag \
          $prerelease
