[package]
name = "kaizen-web"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
leptos = { version = "0.8.20", features = ["csr"] }
console_error_panic_hook = "0.1.7"
kaizen-core =  { path = "../kaizen-core" }
gloo-net = "0.7.0"
thiserror = "2.0.20"
rstest = "0.26.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
web-time = "1.1.0"