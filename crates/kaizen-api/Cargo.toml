[package]
name = "kz-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
kaizen-core =  { path = "../kaizen-core" }
tempfile = "3.27.0"
rstest = "0.26.1"
tower-http = { version = "0.7.1", features = ["cors"] }
serde = { version = "1.0.229", features = ["derive"] }