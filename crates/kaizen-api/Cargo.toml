[package]
name = "kaizen"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
kaizen-core =  { path = "../kaizen-core" }
serde = { version = "1.0.229", features = ["derive"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }

[dev-dependencies]
tempfile = "3.27.0"
rstest = "0.26.1"
